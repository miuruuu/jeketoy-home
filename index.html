*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip;position:relative}
a{color:inherit;text-decoration:none}

.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
/* kepala */
.bar .isi{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:22px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.05em}
.bahasa{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.bahasa button{font:500 12px var(--sans);border:0;background:none;color:var(--mute);padding:6px 11px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
.bahasa button.on{background:var(--ink);color:#09090b}
/* pembuka */
.intro{padding:clamp(28px,6vw,72px) 0 clamp(28px,4vw,44px)}
.intro h1{margin-top:14px;font-size:clamp(30px,4.6vw,52px);font-weight:600;line-height:1.05;letter-spacing:-.04em;max-width:16em}
.intro .lede{margin-top:14px;font-size:clamp(15px,1.5vw,17px);color:var(--mute);max-width:36em}
.mv{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:7px 14px 7px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink);transition:border-color .2s,transform .35s var(--spring)}
.mv::before{content:"♪";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);font-size:12px}
.mv small{color:var(--mute);font-size:11px}
.mv:hover{border-color:var(--line2);transform:translateY(-2px)}
/* kartu proyek */
.grup{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.grup::after{content:"";flex:1;height:1px;background:var(--line)}
.kisi{display:grid;gap:14px;margin-bottom:clamp(36px,5vw,56px)}
.kisi.dua{grid-template-columns:repeat(2,1fr)}
.kisi.tiga{grid-template-columns:repeat(3,1fr)}
.kartu{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;transition:transform .45s var(--spring),border-color .25s;animation:naik .7s var(--out) both}
.kartu:nth-child(2){animation-delay:.06s}.kartu:nth-child(3){animation-delay:.12s}
@keyframes naik{from{opacity:0;transform:translateY(16px)}}
.atas{display:flex;align-items:center;justify-content:space-between;gap:10px}
.atas svg{width:44px;height:44px;transition:transform .45s var(--spring)}
.st{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-live{color:var(--ok);border-color:rgba(76,195,138,.35)}
.st-live::before{animation:denyut 1.8s ease-in-out infinite}
@keyframes denyut{50%{opacity:.3}}
.st-tunggu{color:var(--wait);border-color:rgba(227,162,60,.35)}
.kartu h3{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.kartu.live h3{font-size:clamp(26px,3vw,34px)}
.d{color:var(--mute);font-size:14.5px}
.kartu ul{list-style:none;display:grid;gap:6px;font-size:14px;color:#d8d8de;margin-top:2px}
.kartu li{display:flex;gap:10px}
.kartu li::before{content:"";flex:none;width:5px;height:5px;margin-top:.6em;border-radius:50%;background:var(--blue-t)}
.izin{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--wait);margin-top:auto;padding-top:6px}
.kaki{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.host{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.buka{font-weight:600;font-size:14px;transition:transform .35s var(--spring)}

.kartu.live:hover{transform:translateY(-4px);border-color:var(--line2)}

.kartu.live:hover .buka{transform:translateX(4px)}
.kartu.live::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%,rgba(34,74,167,.25),transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none}

.disc{margin-top:22px;font-size:13px;line-height:1.65;color:var(--mute)}.disc summary{cursor:pointer;color:var(--ink)}.disc p{margin-top:8px;max-width:48em}.disc b{color:var(--ink);font-weight:600}.disc a{text-decoration:underline}
.bawah{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--mute)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  var PEDULI={"id":"<section class=\"peduli pd-home\"><h2>Jangan cuma lewat</h2><ul><li><div class=\"pd-k\"><b>Palestina</b></div><p>Tenda kebanjiran, bantuan tipis. Dunia sibuk scroll, kamu jangan.</p><div class=\"pd-l\"><a href=\"https://www.ochaopt.org/\" target=\"_blank\" rel=\"noopener noreferrer\">OCHA</a><a href=\"https://www.unrwa.org/\" target=\"_blank\" rel=\"noopener noreferrer\">UNRWA</a><a href=\"https://mer-c.org/\" target=\"_blank\" rel=\"noopener noreferrer\">MER-C</a></div></li><li><div class=\"pd-k\"><b>Ebola, Kongo</b></div><p>Wabahnya belum terkendali. Nggak masuk FYP bukan berarti nggak ada.</p><div class=\"pd-l\"><a href=\"https://www.who.int/emergencies/situations/ebola-outbreak---drc-2026\" target=\"_blank\" rel=\"noopener noreferrer\">WHO</a><a href=\"https://www.unicef.org/\" target=\"_blank\" rel=\"noopener noreferrer\">UNICEF</a></div></li><li><div class=\"pd-k\"><b>Hutan kita</b></div><p>Asapnya mulai reda di sebagian daerah, tapi titik api belum padam semua dan yang terdampak masih butuh dukungan.</p><div class=\"pd-l\"><a href=\"https://www.bnpb.go.id/\" target=\"_blank\" rel=\"noopener noreferrer\">BNPB</a><a href=\"https://www.walhi.or.id/\" target=\"_blank\" rel=\"noopener noreferrer\">WALHI</a><a href=\"https://www.greenpeace.org/indonesia/\" target=\"_blank\" rel=\"noopener noreferrer\">Greenpeace Indonesia</a><a href=\"https://pantaugambut.id/\" target=\"_blank\" rel=\"noopener noreferrer\">Pantau Gambut</a></div></li></ul><p class=\"pd-ajak\"><b>Nggak ada duit?</b> Bayarnya pakai berisik: share dari sumber resmi.</p><p class=\"pd-kecil\">Tidak berafiliasi dengan lembaga mana pun di sini. Tautan cuma rujukan, cek dulu sebelum donasi.</p></section>","en":"<section class=\"peduli pd-home\"><h2>Don’t just scroll past</h2><ul><li><div class=\"pd-k\"><b>Palestine</b></div><p>Flooded tents, thin aid. The world is busy scrolling, you don’t have to be.</p><div class=\"pd-l\"><a href=\"https://www.ochaopt.org/\" target=\"_blank\" rel=\"noopener noreferrer\">OCHA</a><a href=\"https://www.unrwa.org/\" target=\"_blank\" rel=\"noopener noreferrer\">UNRWA</a><a href=\"https://mer-c.org/\" target=\"_blank\" rel=\"noopener noreferrer\">MER-C</a></div></li><li><div class=\"pd-k\"><b>Ebola, Congo</b></div><p>The outbreak is not under control. Not trending doesn’t mean not happening.</p><div class=\"pd-l\"><a href=\"https://www.who.int/emergencies/situations/ebola-outbreak---drc-2026\" target=\"_blank\" rel=\"noopener noreferrer\">WHO</a><a href=\"https://www.unicef.org/\" target=\"_blank\" rel=\"noopener noreferrer\">UNICEF</a></div></li><li><div class=\"pd-k\"><b>Our forests</b></div><p>Smoke is easing in some areas, but not every fire is out and those affected still need support.</p><div class=\"pd-l\"><a href=\"https://www.bnpb.go.id/\" target=\"_blank\" rel=\"noopener noreferrer\">BNPB</a><a href=\"https://www.walhi.or.id/\" target=\"_blank\" rel=\"noopener noreferrer\">WALHI</a><a href=\"https://www.greenpeace.org/indonesia/\" target=\"_blank\" rel=\"noopener noreferrer\">Greenpeace Indonesia</a><a href=\"https://pantaugambut.id/\" target=\"_blank\" rel=\"noopener noreferrer\">Pantau Gambut</a></div></li></ul><p class=\"pd-ajak\"><b>No money?</b> Pay with noise: share official sources.</p><p class=\"pd-kecil\">Not affiliated with any organisation listed here. The links are pointers only, check before donating.</p></section>","ja":"<section class=\"peduli pd-home\"><h2>通り過ぎないで</h2><ul><li><div class=\"pd-k\"><b>パレスチナ</b></div><p>テントは浸水し、支援は足りません。スクロールだけで終わらせないで。</p><div class=\"pd-l\"><a href=\"https://www.ochaopt.org/\" target=\"_blank\" rel=\"noopener noreferrer\">OCHA</a><a href=\"https://www.unrwa.org/\" target=\"_blank\" rel=\"noopener noreferrer\">UNRWA</a><a href=\"https://mer-c.org/\" target=\"_blank\" rel=\"noopener noreferrer\">MER-C</a></div></li><li><div class=\"pd-k\"><b>エボラ(コンゴ)</b></div><p>流行はまだ収まっていません。話題でなくても起きています。</p><div class=\"pd-l\"><a href=\"https://www.who.int/emergencies/situations/ebola-outbreak---drc-2026\" target=\"_blank\" rel=\"noopener noreferrer\">WHO</a><a href=\"https://www.unicef.org/\" target=\"_blank\" rel=\"noopener noreferrer\">UNICEF</a></div></li><li><div class=\"pd-k\"><b>私たちの森</b></div><p>一部の地域では煙が収まりつつありますが、火はまだ消えきっておらず、被災した人々には支援が必要です。</p><div class=\"pd-l\"><a href=\"https://www.bnpb.go.id/\" target=\"_blank\" rel=\"noopener noreferrer\">BNPB</a><a href=\"https://www.walhi.or.id/\" target=\"_blank\" rel=\"noopener noreferrer\">WALHI</a><a href=\"https://www.greenpeace.org/indonesia/\" target=\"_blank\" rel=\"noopener noreferrer\">Greenpeace Indonesia</a><a href=\"https://pantaugambut.id/\" target=\"_blank\" rel=\"noopener noreferrer\">Pantau Gambut</a></div></li></ul><p class=\"pd-ajak\"><b>お金がなくても、</b>公式情報を広めることはできます。</p><p class=\"pd-kecil\">掲載団体とは無関係です。リンクは参考ですので、寄付の前にご確認ください。</p></section>"};
  var DISC={"id":"<details class=\"disc\"><summary>Disclaimer · buat seru-seruan, tidak resmi, santai aja</summary><p><b>Buat seru-seruan.</b> Kumpulan proyek iseng buatan fans, bukan situs resmi. Tidak ada hubungan dengan JKT48 maupun JOT. Semua nama dan merek milik pemiliknya.</p><p><b>Tidak jualan.</b> Tanpa iklan dan tanpa transaksi apa pun.</p><p><b>Privasi.</b> Halaman ini cuma mengingat pilihan bahasamu di browser ini. Halamannya dihosting di GitHub Pages dan lewat Cloudflare demi keamanan; keduanya menerima alamat IP pengunjung. Lewat Cloudflare Web Analytics kami melihat statistik kunjungan gabungan, tanpa cookie pelacak.</p><p><b>Soal AI.</b> Dibuat dengan bantuan AI (Claude Code), termasuk teks ini. Versi Inggris dan Jepang belum dicek penutur asli.</p></details>","en":"<details class=\"disc\"><summary>Disclaimer · just for fun, unofficial, don’t take it too seriously</summary><p><b>Just for fun.</b> A bunch of fan-made side projects, not official. No connection to JKT48 or JOT. All names and brands belong to their owners.</p><p><b>Nothing for sale.</b> No ads and no transactions of any kind.</p><p><b>Privacy.</b> This page only remembers your language choice in this browser. It is hosted on GitHub Pages and goes through Cloudflare for security; both receive visitors’ IP addresses. Through Cloudflare Web Analytics we see combined visit statistics, without tracking cookies.</p><p><b>About AI.</b> Made with AI help (Claude Code), including this text. The English and Japanese versions have not been checked by a native speaker.</p></details>","ja":"<details class=\"disc\"><summary>免責事項 · 趣味の非公式サイトです。気楽にどうぞ</summary><p><b>趣味のサイトです。</b> ファンが作った非公式の遊びプロジェクト集です。JKT48およびJOTとは関係ありません。名称とブランドは各権利者に帰属します。</p><p><b>販売はありません。</b> 広告も取引も一切ありません。</p><p><b>プライバシー。</b> このページが記憶するのは言語の選択だけです。GitHub Pagesで公開し、安全性のためにCloudflareを経由しているため、両者は訪問者のIPアドレスを受け取ります。Cloudflare Web Analyticsで、追跡Cookieを使わずに訪問の集計データを確認しています。</p><p><b>AIについて。</b> この文章を含め、AI(Claude Code)の助けで作りました。英語版と日本語版は
